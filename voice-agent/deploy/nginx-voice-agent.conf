# Reverse-proxy snippet for the voice-agent service. Merge this into whatever
# server{} block already serves aimsai.aimsmarketingsystems.com (the React
# app's vhost) — voice-agent only needs these three location blocks, it
# doesn't need its own server{}/certificate.
#
# The /voice/stream location is a raw WebSocket upgrade (Twilio Media
# Streams), not a normal HTTP proxy — without the Upgrade/Connection headers
# below, Twilio's connection will fail silently and calls will ring with
# no audio on either side.

location /voice/outbound {
  proxy_pass http://127.0.0.1:8091;
  proxy_set_header Host $host;
}

location /voice/incoming {
  proxy_pass http://127.0.0.1:8091;
  proxy_set_header Host $host;
}

location /voice/status {
  proxy_pass http://127.0.0.1:8091;
  proxy_set_header Host $host;
}

location /voice/stream {
  proxy_pass http://127.0.0.1:8091;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  # Twilio holds this connection open for the full length of the call.
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
}
